name: Setup Backend Environment
description: Installs Go, system dependencies, and project dependencies
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.27.0"
        cache: true

    - name: Cache External Libs
      uses: actions/cache@v4
      with:
        path: |
          libs/ten-vad
          libs/agora-server-sdk
        key: backend-libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-libs.sh') }}
        restore-keys: |
          backend-libs-${{ runner.os }}-${{ runner.arch }}-

    - name: Install System Dependencies
      shell: bash
      run: ./scripts/install-sys-deps.sh

    - name: Prepare Project Libraries
      shell: bash
      run: make deps

    - name: Prep Web Dist for Embedding
      shell: bash
      run: mkdir -p clients/web/dist && touch clients/web/dist/index.html
