[project]
name = "voce-remote-plugin-example"
version = "0.1.0"
description = "Example project for Voce Python Remote Plugin SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "voce",
]

[tool.uv.sources]
voce = { path = "../../python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins"]
